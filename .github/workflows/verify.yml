name: Verify Learning Studio

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-57-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 23308:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      AI_LEARN_ENV_FILE: ''
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install uv==0.12.5
          uv pip install --system --require-hashes -r backend/requirements-dev.txt
      - name: Empty-schema migrations and isolated transaction regression on MySQL 5.7
        run: python scripts/test_database.py --tb=short
  isolated-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 23308:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      AI_LEARN_ENV_FILE: ''
      ANONYMIZED_TELEMETRY: 'false'
      E2E_PYTHON: python
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.5
          uv pip install --system --require-hashes -r backend/requirements-dev.txt
          uv pip check --system
      - name: Backend static and offline tests
        run: |
          python -m ruff check backend/app backend/tests backend/integration --select F
          python scripts/test_offline.py -q --tb=short
      - name: Isolated MySQL integration
        run: python scripts/test_database.py --tb=short
      - name: Deterministic algorithm experiment
        run: python scripts/experiment_bkt.py --output .local/ci-algorithm
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck, unit tests and both builds
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build:h5
          npm run build:weapp
          node scripts/check-build.mjs --both
          node scripts/measure-build.mjs --output ../.local/ci-build-size.json
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Actual H5, API, worker and MySQL regression without model calls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_local.py --initialize
          python scripts/run_local.py --serve-h5 --port 18081 > "$RUNNER_TEMP/ai-learn-api.log" 2>&1 &
          api_pid=$!
          PREVIEW_BACKEND_H5=1 node frontend/scripts/preview.mjs > "$RUNNER_TEMP/ai-learn-h5.log" 2>&1 &
          h5_pid=$!
          trap 'kill "$h5_pid" "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18082/ai-learn/api/v1/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd frontend
          npm run test:e2e
